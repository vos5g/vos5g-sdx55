# vosclean settings (sourced by boot.sh). Edit, then run: /data/vosclean/bin/vosclean apply
# SSH: "no" turns off root password login. Ignored (passwords stay on) until a key is in /data/vosclean/roothome/.ssh/authorized_keys.
SSH_PASSWORD_AUTH=no
# Block new inbound connections arriving from the cellular side (rmnet*/ppp*).
FIREWALL_WWAN_BLOCK=yes
# Neutralise the vendor update/command client (fotaclient) and its timer.
DISABLE_FOTACLIENT=yes
# Stop rpcbind and the unused NFS server units.
DISABLE_RPC_NFS=yes
# Keep SSH host keys stable across reboots (stored in /data/vosclean/hostkeys).
PERSIST_HOSTKEYS=yes
# Minimal built-in web UI on https://192.168.225.1:8444 (fallback; needs a password: vosclean uipass)
UI_ENABLE=no
# QManager web UI (http 8080 / https 8443). Watchdog off: it can reboot the modem if its own pings fail.
QM_ENABLE=yes
QM_PORT=8080
QM_TLS_PORT=8443
QM_WATCHDOG=0
