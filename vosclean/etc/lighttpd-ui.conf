# vosclean web UI: separate lighttpd instance, HTTPS on the USB-side address only
server.modules = ( "mod_access", "mod_auth", "mod_authn_file", "mod_alias", "mod_cgi", "mod_setenv", "mod_openssl" )
server.document-root = "/data/vosclean/web"
server.bind = "192.168.225.1"
server.port = 8444
server.pid-file = "/run/vosclean-ui.pid"
server.errorlog = "/data/vosclean/log/ui-error.log"
server.tag = "vosclean"
index-file.names = ( "index.html" )
mimetype.assign = ( ".html" => "text/html; charset=utf-8", ".js" => "text/javascript", ".css" => "text/css", ".svg" => "image/svg+xml" )
ssl.engine = "enable"
ssl.pemfile = "/data/vosclean/etc/ui.pem"
ssl.openssl.ssl-conf-cmd = ("Protocol" => "-ALL, TLSv1.2")
ssl.cipher-list = "EECDH+AESGCM:EDH+AESGCM"
auth.backend = "htpasswd"
auth.backend.htpasswd.userfile = "/data/vosclean/etc/ui.htpasswd"
auth.require = ( "/" => ( "method" => "basic", "realm" => "VOS", "require" => "valid-user" ) )
$HTTP["url"] =~ "^/cgi-bin/" { cgi.assign = ( ".sh" => "/bin/sh" ) }
setenv.add-response-header = ( "X-Frame-Options" => "DENY", "Referrer-Policy" => "no-referrer", "Content-Security-Policy" => "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'" )
